<!doctype html>
<!-- Social preview of the og-cards repository (1280 × 640) – rendered by og-cards itself: node scripts/social-preview.js -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../templates/base.css">
<style>
  html, body { width: 1280px; height: 640px; }
  body { --accent: #7c3aed; background: #07080f; color: #fff; }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(55% 75% at 8% 0%, rgba(124, 58, 237, .45), transparent 70%),
                radial-gradient(45% 60% at 100% 100%, rgba(14, 165, 233, .28), transparent 70%); }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 40px 40px; mask-image: radial-gradient(70% 80% at 30% 40%, #000, transparent 85%); }
  .text { position: absolute; left: 80px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .mark { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 34px; }
  .mark i { width: 54px; height: 54px; border-radius: 15px; background: linear-gradient(135deg, #a855f7, #6366f1 55%, #0ea5e9); display: grid; place-items: center;
    font-style: normal; font-size: 26px; font-weight: 900; box-shadow: 0 12px 30px -10px rgba(124, 58, 237, .8); }
  h1 { font-size: 66px; line-height: 1.04; font-weight: 850; letter-spacing: -.04em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #c084fc, #60a5fa); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 24px; font-size: 25px; line-height: 1.45; color: #b4b9cc; }
  .npm { margin-top: 36px; align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px; border-radius: 14px;
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 22px; color: #e5e7f0; }
  .npm b { color: #c084fc; font-weight: 600; }
  .cards { position: absolute; left: 640px; top: 0; width: 760px; height: 640px; }
  .card { position: absolute; width: 520px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 40px 70px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.12); }
  .card img { width: 100%; }
  .c1 { left: 120px; top: 34px;  transform: rotate(4deg); }
  .c2 { left: 40px;  top: 196px; transform: rotate(-3deg); }
  .c3 { left: 170px; top: 366px; transform: rotate(3deg); }
</style>
<script>
  window.renderCard = async (card) => {
    document.querySelectorAll(".card img").forEach((img, i) => ogCards.image(img, card.images[i]));
  };
</script>
</head>
<body>
  <div class="glow"></div><div class="grid"></div>
  <div class="text">
    <div class="mark"><i>og</i>og-cards</div>
    <h1>Social images<br>that <em>get clicked</em></h1>
    <p class="sub">An og:image for every page – 10 templates or your own HTML design. Eleventy, PHP, Laravel, Angular, Next.js…</p>
    <span class="npm"><b>$</b> npm i @awwwesome-cz/og-cards</span>
  </div>
  <div class="cards">
    <div class="card c1"><img alt=""></div>
    <div class="card c2"><img alt=""></div>
    <div class="card c3"><img alt=""></div>
  </div>
</body>
</html>
