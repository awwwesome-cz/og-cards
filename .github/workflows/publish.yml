# Publishes to npm when you create a GitHub release (tag v1.2.3).
# Needs the NPM_TOKEN secret (npm → Access Tokens → Granular, publish rights for the package).
name: Publish
on:
  release: { types: [published] }
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: https://registry.npmjs.org }
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: npm test
      - run: npm publish
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
