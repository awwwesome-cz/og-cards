# Release: Actions → "Release to npm" → Run workflow → choose the version bump.
#
# Bumps the version in package.json, runs the tests, publishes to npm, then pushes
# the commit + tag vX.Y.Z and creates a GitHub release with generated notes.
# Publishing uses npm Trusted Publishing (OIDC) – no NPM_TOKEN. Setup: RELEASING.md.
# (Keep the file name publish.yml – npm's Trusted Publisher is configured for it.)
name: Release to npm
run-name: Release (${{ inputs.bump }}) by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latestbump:
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest  description: Version bump (patch = fixes, minor = new features, major = breaking changes)
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest  type: choice
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest  options: [patch, minor, major]
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest  default: patch

concurrency: { group: release, cancel-in-progress: false }

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latestname: production
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latesturl: https://www.npmjs.com/package/@awwwesome-cz/og-cards
    permissions: { contents: write, id-token: write }
    steps:
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest- uses: actions/checkout@v4
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest- name: Only from main
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest  if: github.ref != 'refs/heads/main'
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest  run: |
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest    echo "::error::Run the release from the main branch."
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest    exit 1
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest- uses: actions/setup-node@v4
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest  with: { node-version: 24, registry-url: https://registry.npmjs.org }
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest# Trusted Publishing needs npm >= 11.5.1
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest- run: npm install -g npm@latest

 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest- name: Test
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest  run: |
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest    npm install --no-save playwright
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest    npx playwright install --with-deps chromium
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest    npm test

 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest- name: Bump version
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest  id: version
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest  run: |
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest    git config user.name "github-actions[bot]"
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest    npm version ${{ inputs.bump }} -m "Release %s"
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest    echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest- name: Publish to npm
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest  run: npm publish

 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest- name: Push tag and create GitHub release
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest  env: { GH_TOKEN: "${{ github.token }}" }
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest  run: |
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest    git push origin HEAD:main --follow-tags
 Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest    gh release create "${{ steps.version.outputs.tag }}" --generate-notes --verify-tag
