# Release: Actions → "Release to npm" → Run workflow → choose the version bump.
#
# Bumps the version in package.json, runs the tests, publishes to npm, then pushes
# the commit + tag vX.Y.Z and creates a GitHub release with generated notes.
# Publishing uses npm Trusted Publishing (OIDC) – no NPM_TOKEN. Setup: RELEASING.md.
# (Keep the file name publish.yml – npm's Trusted Publisher is configured for it.)
name: Release to npm
run-name: Release (${{ inputs.bump }}) by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (patch = fixes, minor = new features, major = breaking changes)
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency: { group: release, cancel-in-progress: false }

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.npmjs.com/package/@awwwesome-cz/og-cards
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release from the main branch."
          exit 1
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: https://registry.npmjs.org }
      # Trusted Publishing needs npm >= 11.5.1 (pinned to 11 – a new major may change publishing)
      - run: npm install -g npm@11

      - name: Test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm test

      - name: Bump version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }} -m "Release %s"
          echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # Direct publish if npm's Trusted Publisher allows "npm publish";
      # with the "npm stage publish" permission the version is staged instead and goes
      # live after you approve it on npmjs.com (2FA) – see RELEASING.md.
      - name: Publish to npm
        id: publish
        run: |
          set +e
          npm publish 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then echo "staged=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -q "OIDC permission denied" publish.log; then
            echo "::notice::Direct publish not allowed for this workflow – staging the version for approval."
            npm stage publish
            echo "staged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Push tag and create GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git push origin HEAD:main --follow-tags
          if [ "${{ steps.publish.outputs.staged }}" = "true" ]; then
            gh release create "${{ steps.version.outputs.tag }}" --generate-notes --verify-tag \
              --notes "⏳ Staged on npm – goes live after approval on npmjs.com."
            echo "### ⏳ ${{ steps.version.outputs.tag }} is staged on npm" >> "$GITHUB_STEP_SUMMARY"
            echo "Approve it on npmjs.com (package → staged versions) or run \`npm stage list\` + \`npm stage approve <id>\` locally." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "${{ steps.version.outputs.tag }}" --generate-notes --verify-tag
            echo "### ✅ ${{ steps.version.outputs.tag }} published to npm" >> "$GITHUB_STEP_SUMMARY"
          fi
