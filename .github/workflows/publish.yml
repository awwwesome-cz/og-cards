# Publishes to npm when a GitHub release is published (tag v1.2.3 = version in package.json).
# Uses npm Trusted Publishing (OIDC) – no NPM_TOKEN needed. Setup: see RELEASING.md.
name: Publish
on:
  release: { types: [published] }
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: https://registry.npmjs.org }
      # Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - name: Tag must match package.json version
        run: |
          v="v$(node -p 'require("./package.json").version')"
          [ "$v" = "${{ github.event.release.tag_name }}" ] || { echo "::error::Release tag ${{ github.event.release.tag_name }} ≠ package.json $v"; exit 1; }
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: npm test
      - run: npm publish
