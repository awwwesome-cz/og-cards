<!doctype html>
<!--
  og-cards › docs – documentation, guides, changelogs, developer content.
  Fields: breadcrumb (["Docs", "Guides"] or "Docs / Guides"), title, description, version, site, logo, accent
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { display: flex; flex-direction: column; padding: 64px 80px 58px; background: #0f1420; color: #e8ebf3; --muted: #98a1b6; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .045) 1px, transparent 1px);
    background-size: 48px 48px; mask-image: radial-gradient(90% 90% at 100% 0%, #000, transparent 75%); }
  .bracket { position: absolute; right: 64px; top: 40px; font-size: 300px; font-weight: 300; line-height: 1;
    color: color-mix(in oklab, var(--accent) 55%, transparent); letter-spacing: -.08em; }
  .crumbs { position: relative; display: flex; align-items: center; gap: 14px; font-size: 25px; font-weight: 600; color: var(--muted); }
  .crumbs .sep { opacity: .5; }
  .crumbs span:last-child { color: color-mix(in oklab, var(--accent) 60%, #fff); }
  .main { position: relative; flex: 1; padding: 20px 0; max-width: 900px; }
  #title { font-size: 74px; color: #fff; }
  #description { margin-top: 22px; font-size: 28px; }
  .foot { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .brand { color: #fff; font-size: 25px; }
  .brand img { height: 44px; }
  #version { font-size: 22px; font-weight: 700; color: #fff; background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .14); }
</style>
<script src="base.js"></script>
<script>
  window.renderCard = async (card) => {
    ogBase.apply(card);
    const parts = Array.isArray(card.breadcrumb) ? card.breadcrumb : String(card.breadcrumb || "").split("/").map((s) => s.trim()).filter(Boolean);
    const crumbs = document.querySelector(".crumbs");
    crumbs.innerHTML = "";
    parts.forEach((p, i) => {
      if (i) crumbs.append(Object.assign(document.createElement("span"), { className: "sep", textContent: "/" }));
      crumbs.append(Object.assign(document.createElement("span"), { textContent: p }));
    });
    crumbs.hidden = !parts.length;
    ogCards.text("#version", card.version);
    await ogBase.fitTitle();
  };
</script>
</head>
<body>
  <div class="grid"></div>
  <div class="bracket">{ }</div>
  <div class="crumbs"></div>
  <div class="main">
    <h1 id="title"></h1>
    <p id="description"></p>
  </div>
  <div class="foot">
    <div class="brand"><img id="logo" alt=""><span id="site"></span></div>
    <span class="pill" id="version"></span>
  </div>
</body>
</html>
