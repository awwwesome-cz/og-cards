<!doctype html>
<!--
  og-cards › default – clean light card with an accent bar.
  Fields: eyebrow, title, description, site, logo, accent
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { display: flex; flex-direction: column; padding: 72px 80px 64px; background: #f8fafc; border-top: 14px solid var(--accent); }
  .main { flex: 1; }
  #eyebrow { font-size: 24px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 20px; }
  #title { font-size: 74px; }
  #description { margin-top: 24px; font-size: 30px; }
  .brand { color: #334155; }
</style>
<script src="base.js"></script>
<script>
  window.renderCard = async (card) => {
    ogBase.apply(card);
    await ogBase.fitTitle();
  };
</script>
</head>
<body>
  <div class="main">
    <p id="eyebrow"></p>
    <h1 id="title"></h1>
    <p id="description"></p>
  </div>
  <div class="brand"><img id="logo" alt=""><span id="site"></span></div>
</body>
</html>
