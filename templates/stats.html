<!doctype html>
<!--
  og-cards › stats – case studies and results. Concrete numbers get clicks.
  Fields: eyebrow, title, stats ([{ value: "+312 %", label: "organic traffic" }, …] – up to 3),
          site, logo, accent
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { display: flex; flex-direction: column; padding: 60px 72px 56px; background: #0b1020; color: #fff; --muted: #a3aac0; }
  body::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(60% 80% at 0% 0%, color-mix(in oklab, var(--accent) 40%, transparent), transparent 70%); }
  .top { position: relative; display: flex; align-items: center; justify-content: space-between; }
  #eyebrow { background: rgba(255, 255, 255, .1); color: #fff; }
  .brand { color: #fff; font-size: 24px; }
  .brand img { height: 42px; }
  .main { position: relative; flex: 1; padding: 22px 0 26px; }
  #title { font-size: 62px; max-width: 1000px; }
  .stats { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 22px; }
  .stat { border-radius: 24px; padding: 26px 30px 24px; background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .1); }
  .stat:first-child { background: var(--accent); box-shadow: none; }
  .value { font-size: 68px; font-weight: 850; letter-spacing: -.04em; line-height: 1; white-space: nowrap; }
  .label { margin-top: 10px; font-size: 23px; color: rgba(255, 255, 255, .78); line-height: 1.3; }
</style>
<script src="base.js"></script>
<script>
  window.renderCard = async (card) => {
    ogBase.apply(card);
    const box = document.querySelector(".stats");
    const stats = (card.stats || []).slice(0, 3);
    box.innerHTML = stats.map(() => `<div class="stat"><div class="value"></div><div class="label"></div></div>`).join("");
    box.querySelectorAll(".stat").forEach((el, i) => {
      el.querySelector(".value").textContent = stats[i].value ?? "";
      el.querySelector(".label").textContent = stats[i].label ?? "";
    });
    box.hidden = !stats.length;
    // long values in narrow tiles
    for (const v of box.querySelectorAll(".value")) await ogCards.fit(v, { min: 36, maxLines: 1, lineHeight: 1 });
    await ogBase.fitTitle({ min: 36, maxLines: 2 });
  };
</script>
</head>
<body>
  <div class="top">
    <p class="pill" id="eyebrow"></p>
    <div class="brand"><img id="logo" alt=""><span id="site"></span></div>
  </div>
  <div class="main"><h1 id="title"></h1></div>
  <div class="stats"></div>
</body>
</html>
