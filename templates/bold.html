<!doctype html>
<!--
  og-cards › bold – full-bleed gradient, huge white headline and a call-to-action button.
  Stands out in busy feeds; good for landing pages, launches, offers.
  Fields: eyebrow, title, description, cta, site, logo (light version), accent, accent2
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { display: flex; flex-direction: column; padding: 70px 80px 64px; color: #fff;
    background: radial-gradient(120% 140% at 0% 0%, var(--accent) 0%, var(--accent-2) 70%); }
  .glow { position: absolute; border-radius: 50%; filter: blur(10px); }
  .glow.a { width: 560px; height: 560px; right: -160px; top: -220px; background: rgba(255, 255, 255, .14); }
  .glow.b { width: 380px; height: 380px; right: 140px; bottom: -260px; background: rgba(255, 255, 255, .08); }
  .main { position: relative; flex: 1; }
  #eyebrow { background: rgba(255, 255, 255, .16); color: #fff; margin-bottom: 26px; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .28); }
  #title { font-size: 92px; letter-spacing: -.04em; max-width: 1000px; }
  #description { margin-top: 24px; font-size: 31px; color: rgba(255, 255, 255, .82); max-width: 900px; }
  .foot { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .brand { color: #fff; }
  .cta { background: #fff; color: var(--accent-2); box-shadow: 0 18px 40px -14px rgba(0, 0, 0, .45); }
</style>
<script src="base.js"></script>
<script>
  window.renderCard = async (card) => {
    ogBase.apply(card);
    await ogBase.fitTitle({ min: 48 });
  };
</script>
</head>
<body>
  <div class="glow a"></div><div class="glow b"></div>
  <div class="main">
    <p class="pill" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p id="description"></p>
  </div>
  <div class="foot">
    <div class="brand"><img id="logo" alt=""><span id="site"></span></div>
    <span class="cta" id="cta"></span>
  </div>
</body>
</html>
