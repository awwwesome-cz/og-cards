<!doctype html>
<!--
  og-cards › split – text on the left, a screenshot or photo on the right.
  For products, apps, case studies, portfolio items – show the thing itself.
  Fields: eyebrow, title, description, cta, image, site, logo, accent
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { display: grid; grid-template-columns: 590px 1fr; }
  .text { display: flex; flex-direction: column; padding: 64px 40px 60px 72px; }
  .main { flex: 1; }
  #eyebrow { background: color-mix(in oklab, var(--accent) 12%, #fff); color: var(--accent); margin-bottom: 24px; }
  #title { font-size: 58px; }
  #description { margin-top: 18px; font-size: 25px; }
  .cta { align-self: flex-start; flex: none; margin-top: 28px; height: 58px; font-size: 23px; padding: 0 26px; }
  .brand { margin-top: 20px; }
  .brand { font-size: 23px; }
  .brand img { height: 40px; }
  .visual { position: relative; overflow: hidden;
    background: radial-gradient(90% 90% at 100% 0%, color-mix(in oklab, var(--accent) 55%, #fff), color-mix(in oklab, var(--accent) 18%, #fff)); }
  .visual::before { content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, .55) 1.5px, transparent 1.6px); background-size: 24px 24px; }
  #image { position: absolute; left: 44px; top: 70px; width: 640px; height: 520px; object-fit: cover; object-position: top left;
    border-radius: 18px; box-shadow: 0 40px 80px -24px rgba(11, 16, 32, .45), 0 0 0 1px rgba(11, 16, 32, .08); background: #fff; }
</style>
<script src="base.js"></script>
<script>
  window.renderCard = async (card) => {
    ogBase.apply(card);
    await ogBase.fitTitle({ min: 34, maxLines: 3 });
  };
</script>
</head>
<body>
  <div class="text">
    <div class="main">
      <p class="pill" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p id="description"></p>
      <span class="cta" id="cta"></span>
    </div>
    <div class="brand"><img id="logo" alt=""><span id="site"></span></div>
  </div>
  <div class="visual"><img id="image" alt=""></div>
</body>
</html>
