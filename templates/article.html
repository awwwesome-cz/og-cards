<!doctype html>
<!--
  og-cards › article – blog posts and news. A face and a name next to the headline build trust.
  Fields: eyebrow (category), title, description, author, avatar (photo; initials without it),
          role, date, readingTime, site, logo, accent
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { display: flex; flex-direction: column; padding: 68px 80px 60px; background: #fbfaf7; }
  body::after { content: ""; position: absolute; right: -120px; top: -120px; width: 420px; height: 420px; border-radius: 50%;
    background: color-mix(in oklab, var(--accent) 14%, transparent); }
  .top { position: relative; display: flex; align-items: center; justify-content: space-between; z-index: 1; }
  #eyebrow { background: color-mix(in oklab, var(--accent) 12%, #fff); color: var(--accent); }
  .brand { color: var(--ink); font-size: 24px; }
  .brand img { height: 42px; }
  .main { position: relative; flex: 1; padding: 26px 0; z-index: 1; }
  #title { font-size: 72px; }
  #description { margin-top: 20px; font-size: 28px; }
  .author { position: relative; display: flex; align-items: center; gap: 20px; padding-top: 28px; border-top: 2px solid var(--line); z-index: 1; }
  .who { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #author { font-size: 28px; font-weight: 700; }
  .meta { display: flex; align-items: center; gap: 14px; font-size: 23px; color: var(--muted); white-space: nowrap; }
</style>
<script src="base.js"></script>
<script>
  window.renderCard = async (card) => {
    ogBase.apply(card);
    ogBase.avatar("#avatar", card.author, card.avatar);
    ogCards.text("#author", card.author);
    const meta = [card.role, card.date, card.readingTime].filter(Boolean);
    const el = document.getElementById("meta");
    el.innerHTML = "";
    meta.forEach((m, i) => {
      if (i) el.append(Object.assign(document.createElement("span"), { className: "dot" }));
      el.append(Object.assign(document.createElement("span"), { textContent: m }));
    });
    el.hidden = !meta.length;
    document.querySelector(".author").hidden = !card.author && !meta.length;
    await ogBase.fitTitle();
  };
</script>
</head>
<body>
  <div class="top">
    <p class="pill" id="eyebrow"></p>
    <div class="brand"><img id="logo" alt=""><span id="site"></span></div>
  </div>
  <div class="main">
    <h1 id="title"></h1>
    <p id="description"></p>
  </div>
  <div class="author">
    <div class="avatar" id="avatar"></div>
    <div class="who"><span id="author"></span><span class="meta" id="meta"></span></div>
  </div>
</body>
</html>
